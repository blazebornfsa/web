obores bien todos los datos que cargas al momento de la compra. Un error en el domicilio por ejemplo, puede atrasar todo)\n\n¿Cuanto demora el envío? 🚀\n\nUna vez despachado el paquete (Por andreani o correo argentino), tardan entre 2 y 5 días hábiles en ser entregados a domicilio/Sucursal. Les enviamos siempre código de seguimiento así pueden ir rastreando su paquete e ir viendo sus movimientos. Esto te facilita saber con exactitud el día que va a llegar.\n\n\n¿Còmo es el funcionamiento de la tienda? 💻\nLa tienda online esta siempre actualizada. Los productos que ves disponibles son los que tienen stock y que podés comprar en cualquier momento.\n\n¿Cuàles son los medios de pago? 💳\n\nLos medios de pago que son aceptados por ahora: Mercado Pago, transferencia bancaria o efectivo si es presencial (Formosa)\n \n¿Cómo puedo saber el estado de mi pedido? 📦\nTodos los pedidos se despachan dentro de las próximas 96 horas hábiles desde que se acredita el pago. Una vez despachado, vas a recibir por correo electrónico tu código de seguimiento para que puedas ver todos los movimientos del envío.\n\nSi todavía no recibiste el seguimiento o necesitás consultar el estado de tu compra, comunicate al +54 9 3704509580, indicando tu número de orden o tu comprobante de pago.\n\nCompré y necesito realizar un cambio de talle 🔄\nPara cambiar tus productos por otro talle o modelo, comunicate al +54 9 3704509580 y envianos la siguiente información:\n\n• Número de orden o comprobante de pago.\n• Foto de los productos que necesitás cambiar.\n• Talle o producto nuevo que te gustaría recibir.\n• Sucursal oficial de Andreani o correo argentino que te resulte más cómoda para realizar el cambio.\n\nUna vez recibida esta información, nuestro equipo te indicará cómo continuar. Tené en cuenta que el proceso de cambio puede demorar entre 3 y 7 días hábiles.\n\nNo sé qué talle pedir 📏\n\nPara elegir el talle ideal, te recomendamos consultar la tabla de talles disponible dentro de la publicación de cada producto en nuestra tienda online.\n\nRecomendaciones de la casa:\n\nEn nuestras remeras de Compresión, recomendamos elegir el talle que usás normalmente. Si preferís que quede más ajustada y compresiva, podés elegir un talle menos.\n\nAnte cualquier duda, comunicate al +54 9 3704509580 y te ayudamos a elegir según tu estatura y peso.\n\n \n\n¿Los productos tienen garantía?\n\nEn BlazeBorn queremos que uses tus productos sin preocupaciones, por eso ofrecemos garantía de por vida para defectos de fabricación. Esto incluye problemas como fallas en las costuras, tela en mal estado o detalles mal terminados.\n\nAhora bien, la garantía no cubre daños por mal uso ni accidentes, como roturas o cualquier otro tipo de manipulación incorrecta. Apostamos a la calidad de nuestros productos, pero el cuidado diario depende de vos 😉\n\nSi llegás a notar un defecto de fábrica, escribinos y lo resolvemos al toque. Estamos a tu disposición.\n\nTel de contacto : +54 9 3704509580"},{"id":"d0x6wp","type":"text","kind":"p","align":"center","text":"CONTACTO: +54 9 3704509580\n3704509580"}],"align":"center"},{"id":"y56t5d","name":"Seguimiento de Envíos","main":false,"style":{"themes":[{"bg":"#fbfaf8","fg":"#151515","card":"#ffffff","accent":"#ff0000","accentFg":"#ffffff","border":"#e3dfd9","barBg":"#151515","barFg":"#ffffff"},{"bg":"#0f0f11","fg":"#f3f3f3","card":"#1b1b1f","accent":"#ff0000","accentFg":"#ffffff","border":"#34343a","barBg":"#11ff00","barFg":"#000000"}],"ui":{"bw":0,"radius":12},"el":{"cart":{"fill":"custom","fillC":"#ff0000"},"menu":{"fill":"none","fillC":"#000000","stroke":"custom","strokeC":"#ffffff","sw":2,"r":12},"btn":{"fill":"custom","fillC":"#00ad0c","stroke":"none"},"badge":{"fill":"custom","fillC":"#00ad23","stroke":"none","r":12},"chip":{"fill":"none","fillC":"#e8431f","stroke":"custom","strokeC":"#888888","sw":3},"win":{"fill":"auto","fillC":"#e8431f","stroke":"custom","strokeC":"#ff0000","sw":2},"imgblk":{"fill":"auto","fillC":"#1c0703","stroke":"auto","strok function openCart(){closeL('mm');mount('<div class="ov r" id="cm"><aside class="drawer"></aside></div>','cm');renderCart()}
function renderCart(){
 var el=$('#cm .drawer');if(!el)return;
 st.cart=st.cart.filter(function(c){return P(c.id)});
 var tot=0;
 var body=st.cart.length?st.cart.map(function(c,i){var p=P(c.id),sub=eff(p)*c.qty;tot+=sub;
  return '<div class="ci">'+img(p.images[0],p.name)+'<div class="cin"><b>'+esc(p.name)+'</b>'+(c.size?'<small>Talle: '+esc(c.size)+'</small>':'')+'<small>'+fmt(eff(p))+' c/u</small><div class="qty"><button data-a="dec" data-i="'+i+'" aria-label="Quitar uno">−</button><span>'+c.qty+'</span><button data-a="inc" data-i="'+i+'" aria-label="Agregar uno">+</button></div></div><div class="cs">'+fmt(sub)+'</div></div>'}).join(''):'<p class="empty">Tu carrito está vacío.</p>';
 el.innerHTML='<div class="dh"><h3>Carrito</h3><button class="x" data-a="close" data-t="cm" aria-label="Cerrar">'+FB.close+'</button></div><div class="dbody">'+body+'</div>'+
 (st.cart.length?'<div class="df"><div class="row tot"><span>Total estimado</span><span>'+fmt(tot)+'</span></div><p class="note">Es un estimado: no incluye el costo de envío.</p><button class="btn" data-a="cartbuy"'+bk('cartbuy')+'>'+bt('cartbuy')+'</button><button class="lnk" data-a="clear"'+bk('clear')+'>'+bt('clear')+'</button></div>':'');
}

/* ---------- Checkout ---------- */
var EXF=['name','province','city','phone','notes'];
function exclMatch(){var e=D.excl,d=ck.data;return !!(e&&e.enabled&&norm(d.province)&&norm(d.province)===norm(e.province)&&norm(d.city)===norm(e.city))}
function g(k){return String(ck.data[k]||'').trim()}
function valid(ex){
 var req=ex?['name','province','city','phone']:['name','province','city','dni','zip','address','email','phone'];
 for(var i=0;i<req.length;i++)if(!g(req[i]))return false;
 if(g('phone').replace(/\D/g,'').length<6)return false;
 if(!ex){if(!/^\S+@\S+\.\S+$/.test(g('email')))return false;if(g('dni').replace(/\D/g,'').length<6)return false}
 return true;
}
function calc(){
 var L=lines(ck.items),sub=0,units=0;
 L.forEach(function(x){sub+=eff(x.p)*x.c.qty;units+=x.c.qty});
 var disc=Math.round(sub*ck.pct)/100;
 var free=D.bar.enabled&&(D.bar.mode==='units'?units>=Number(D.bar.units):sub>=Number(D.bar.amount));
 var ship=0,m=null;
 if(ck.ship&&ck.opt){m=D.ships.filter(function(s){return s.id===ck.ship})[0];ship=free?0:(m?Number(m[ck.opt])||0:0)}
 return {L:L,sub:sub,disc:disc,ship:ship,free:free,m:m,total:sub-disc+ship};
}
function openCheckout(items){
 if(!lines(items).length)return;
 closeL('cm');closeL('pm');closeL('mm');
 ck={items:items,code:null,pct:0,ship:null,opt:null,data:{}};
 var F=[['name','Nombre completo','Mario González','text'],['province','Provincia','Santa Fe','text'],['city','Localidad','Rosario','text'],['dni','Número de DNI','30123456','text'],['zip','Código postal','2000','text'],['address','Dirección','Av. San Martín 1234','text'],['email','Correo electrónico','mario@gmail.com','email'],['phone','Número de teléfono','3704123456','tel']];
 var fields=F.map(function(f){return '<label class="fi" data-w="'+f[0]+'"><span>'+f[1]+'</span><input data-f="'+f[0]+'" type="'+f[3]+'" placeholder="'+esc(f[2])+'"'+(f[0]==='province'?' list="provs"':'')+(f[0]==='dni'||f[0]==='zip'?' inputmode="numeric"':'')+' autocomplete="off"></label>'}).join('')+
  '<label class="fi" data-w="notes"><span>Indicaciones (opcional)</span><textarea data-f="notes" rows="5" placeholder="Ej: entre calles, horario de entrega, referencias…"></textarea></label>';
 var h='<div class="ck" id="ck"><div class="ckw"><header class="ckh"><button class="x" data-a="close" data-t="ck" aria-label="Cerrar">'+FB.close+'</button><h2>Finalizar compra</h2></header>'+
 '<section class="box"><h3>Tu pedido</h3><div id="sum"></div></section><section class="box sumbox" id="sumbox"><div id="tots"></div></section>'+
 '<section class="box"><h3>Canjear código</h3><div class="cr"><input class="in" id="code" placeholder="Código de descuento" autocomplete="off"><button class="btn" data-a="applycode"'+bk('redeem')+'>'+bt('redeem')+'</button></div><div class="msg" id="cmsg"></div></section>'+
 '<section class="box"><h3>Tus datos</h3><datalist id="provs">'+PROVS.map(function(p){return '<option value="'+esc(p)+'">'}).join('')+'</datalist><div id="fields">'+fields+'</div></section>'+
 '<section class="box" id="shipbox" hidden></section><div id="final"></div></div></div>';
 var ce=mount(h,'ck');
 ce.addEventListener('scroll',function(){var b=$('#sumbox');if(!b)return;b.classList.toggle('mini',ce.scrollTop>60&&b.getBoundingClientRect().top<=ce.getBoundingClientRect().top+4)},{passive:true});
 $('#sum').innerHTML=calc().L.map(function(x){return '<div class="ci">'+img(x.p.images[0],x.p.name)+'<div class="cin"><b>'+esc(x.p.name)+'</b>'+(x.c.size?'<small>Talle: '+esc(x.c.size)+'</small>':'')+'<small>'+x.c.qty+' × '+fmt(eff(x.p))+'</small></div><div class="cs">'+fmt(eff(x.p)*x.c.qty)+'</div></div>'}).join('');
 updateCk();
}
function updateCk(){
 if(!ck)return;
 var ex=exclMatch(),c=calc();
 Array.prototype.forEach.call(document.querySelectorAll('#fields [data-w]'),function(w){w.hidden=ex&&EXF.indexOf(w.dataset.w)<0});
 var t='<div class="row r-sub"><span>Subtotal</span><span>'+fmt(c.sub)+'</span></div>';
 if(ck.code)t+='<div class="row r-disc"><span>Descuento ('+esc(ck.code)+' −'+ck.pct+'%)</span><span>−'+fmt(c.disc)+'</span></div>';
 if(ex)t+='<div class="row r-ship"><span>Envío</span><span>A coordinar</span></div>';
 else if(ck.opt)t+='<div class="row r-ship"><span>Envío ('+esc(c.m?c.m.name:'')+' · '+(ck.opt==='home'?'domicilio':'sucursal')+')</span><span>'+(c.free?'<span class="free">Gratis</span>':fmt(c.ship))+'</span></div>';
 t+='<div class="row tot r-tot"><span>Total</span><span>'+fmt(c.total)+'</span></div>';
 if(c.free&&!ex)t+='<p class="note free">¡Tu compra tiene envío gratis!</p>';
 $('#tots').innerHTML=t;
 var ok=valid(ex),sb=$('#shipbox'),fin=$('#final');
 if(ex){
  sb.hidden=true;
  fin.innerHTML=ok?'<button class="btn" data-a="final"'+bk('excl')+'>'+bt('excl')+'</button>':'<p class="note">Completá tus datos para continuar.</p>';
  return;
 }
 if(!ok){sb.hidden=true;fin.innerHTML='<p class="note">Completá todos tus datos para elegir el medio de envío.</p>';return}
 if(!D.ships.length){sb.hidden=true;fin.innerHTML='<button class="btn" data-a="final"'+bk('final')+'>'+bt('final')+'</button>';return}
 sb.hidden=false;
 var h='';
 var ico=function(s){return s.icon?img(s.icon,s.name,'',szs(s.sz,true)):'<span class="ph">📦</span>'};
 if(!ck.ship){
  h='<h3>Elegí el medio de envío</h3>'+D.ships.map(function(s){return '<button class="sm" data-a="ship" data-id="'+s.id+'">'+ico(s)+'<span>'+esc(s.name)+'</span></button>'}).join('');
 }else{
  var m=D.ships.filter(function(s){return s.id===ck.ship})[0];
  h='<h3>Medio de envío</h3><div class="sm sel">'+ico(m)+'<span>'+esc(m.name)+'</span></div><button class="lnk" data-a="unship"'+bk('unship')+' style="width:auto;padding:0 0 12px">'+bt('unship')+'</button><h3>¿Cómo lo recibís?</h3>'+
  ['branch','home'].map(function(o){var pr=c.free?'<span class="free">Gratis</span>':fmt(m[o]);return '<button class="opt" data-a="opt" data-o="'+o+'"><span class="cdot'+(ck.opt===o?' on':'')+'"></span><span>'+(o==='branch'?'Envío a sucursal':'Envío a domicilio')+'</span><b>'+pr+'</b></button>'}).join('');
 }
 sb.innerHTML=h;
 fin.innerHTML=(!ck.ship||!ck.opt)?'':'<button class="btn" data-a="final"'+bk('final')+'>'+bt('final')+'</button>';
}
function waMsg(){
 var c=calc(),ex=exclMatch(),L=[];
 L.push('Hola, quiero confirmar mi compra.','','Precio Total: '+fmt(c.total),'','Productos:');
 c.L.forEach(function(x){L.push('- '+x.p.name+(x.c.size?' (Talle: '+x.c.size+')':'')+' x'+x.c.qty+' = '+fmt(eff(x.p)*x.c.qty))});
 L.push('');
 if(ex)L.push('• Medio de Envío: Envío a sucursal (Coordinar)');
 else L.push('• Medio de Envío: '+(c.m?c.m.name+' ('+(ck.opt==='home'?'Domicilio':'Sucursal')+')':'A coordinar'));
 if(ck.code)L.push('','*Código Canjeado:* '+ck.code);
 L.push('','Datos del Cliente:','• Nombre: '+g('name'));
 if(!ex)L.push('• DNI: '+g('dni'));
 L.push('• Teléfono: '+g('phone'),'• Provincia: '+g('province'),'• Localidad: '+g('city'));
 if(!ex)L.push('• Código Postal: '+g('zip'),'• Dirección: '+g('address'),'• Correo: '+g('email'));
 L.push('• Indicaciones: '+(g('notes')||'Sin indicaciones'));
 return L.join('\n');
}

/* ---------- Eventos ---------- */
document.addEventListener('click',function(e){
 var t=e.target.closest('[data-a]');
 if(!t){if(e.target.classList&&e.target.classList.contains('ov')){e.target.remove();lock()}return}
 var a=t.dataset.a,d=t.dataset;
 if(a==='menu')openMenu();
 else if(a==='home')go(D.pages[0].id);
 else if(a==='cartopen')openCart();
 else if(a==='close')closeL(d.t);
 else if(a==='go')go(d.p);
 else if(a==='open'){closeL('mm');openProduct(d.id)}
 else if(a==='buy')quick(d.id,'buy');
 else if(a==='add')quick(d.id,'add');
 else if(a==='thumb')showImg(+d.i);
 else if(a==='prev'||a==='next'){var c0=t.closest('.car');if(c0)slideTo(c0,(+c0.dataset.i)+(a==='next'?1:-1))}
 else if(a==='gprev')showImg((pm.idx||0)-1);
 else if(a==='gnext')showImg((pm.idx||0)+1);
 else if(a==='size'){pm.size=d.s;Array.prototype.forEach.call(document.querySelectorAll('#pm .chip'),function(c){c.classList.toggle('on',c.dataset.s===d.s)});$('#pmerr').textContent=''}
 else if(a==='zoom')mount('<div class="ov mod" id="gm"><div class="dlg box guide"><button class="x" data-a="close" data-t="gm" aria-label="Cerrar">'+FB.close+'</button>'+img(d.f,'','gimg')+'</div></div>','gm');
 else if(a==='navopen'){navStack.push(d.id);renderSub()}
 else if(a==='navback'){navStack.pop();if(navStack.length)renderSub();else $('#mm .drawer').innerHTML=menuRoot()}
 else if(a==='navgo'){if(d.p)go(d.p)}
 else if(a==='guide')openGuide(d.id);
 else if(a==='pbuy'){if(ensureSize()){var id=pm.id,sz=pm.size||'';openCheckout([{id:id,size:sz,qty:1}])}}
 else if(a==='padd'){if(ensureSize())addCart(pm.id,pm.size||'',1)}
 else if(a==='inc'){var c1=st.cart[+d.i];if(c1){c1.qty=Math.min(99,c1.qty+1);persist();updCount();renderCart()}}
 else if(a==='dec'){var c2=st.cart[+d.i];if(c2){c2.qty--;if(c2.qty<=0)st.cart.splice(+d.i,1);persist();updCount();renderCart()}}
 else if(a==='clear'){st.cart=[];persist();updCount();renderCart()}
 else if(a==='cartbuy')openCheckout(st.cart.map(function(c){return {id:c.id,size:c.size,qty:c.qty}}));
 else if(a==='theme'){st.theme=st.theme?0:1;applyTheme();persist();notify();t.classList.toggle('r',!!st.theme);t.setAttribute('aria-checked',st.theme?'true':'false');$('#tn0').classList.toggle('on',!st.theme);$('#tn1').classList.toggle('on',!!st.theme)}
 else if(a==='applycode'){
  var v=String($('#code').value).trim().toUpperCase(),f=D.codes.filter(function(c){return String(c.code).trim().toUpperCase()===v})[0],m=$('#cmsg');
  if(v&&f){ck.code=f.code;ck.pct=Number(f.pct)||0;m.className='msg ok';m.textContent='Código aplicado: '+ck.pct+'% de descuento.'}
  else{ck.code=null;ck.pct=0;m.className='msg bad';m.textContent='El código no es válido.'}
  updateCk();
 }
 else if(a==='ship'){ck.ship=d.id;ck.opt=null;updateCk()}
 else if(a==='unship'){ck.ship=null;ck.opt=null;updateCk()}
 else if(a==='opt'){ck.opt=d.o;updateCk()}
 else if(a==='final'){
  var num=waNum();if(!num){toast('Falta configurar el número de WhatsApp');return}
  window.open('https://wa.me/'+num+'?text='+encodeURIComponent(waMsg()),'_blank');
 }
});
document.addEventListener('input',function(e){
 var el=e.target;
 if(el.id==='q')renderQ(el.value);
 else if(ck&&el.dataset&&el.dataset.f){ck.data[el.dataset.f]=el.value;updateCk()}
});
document.addEventListener('keydown',function(e){
 if(e.key==='Escape'&&layer&&layer.lastElementChild){layer.lastElementChild.remove();lock()}
 else if((e.key==='ArrowLeft'||e.key==='ArrowRight')&&layer&&layer.lastElementChild&&layer.lastElementChild.id==='pm'&&pm)showImg((pm.idx||0)+(e.key==='ArrowRight'?1:-1));
});

var tx=0,ty=0,tc=null;
document.addEventListener('touchstart',function(e){var c=e.target.closest&&e.target.closest('.car');if(!c)return;tc=c;tx=e.touches[0].clientX;ty=e.touches[0].clientY},{passive:true});
document.addEventListener('touchend',function(e){if(!tc)return;var dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;if(Math.abs(dx)>40&&Math.abs(dx)>Math.abs(dy))slideTo(tc,(+tc.dataset.i)+(dx<0?1:-1));tc=null},{passive:true});
load();
if(D.themeMode==='single')st.theme=Number(D.defaultTheme)||0;
if(!D.pages.some(function(p){return p.id===st.page}))st.page=D.pages[0].id;
shell();applyTheme();renderBar();renderMain();updCount();notify();
})();

</script>
</body>
</html>
